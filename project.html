<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project – Ayaan Ahamed F</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6d4b1" />
    <link rel="icon" type="image/png" href="/icon/32x32.png" />
    <link rel="stylesheet" href="/src/main.css" />
    <script type="module" src="/src/project.ts"></script>
  </head>
  <body>
    <main class="project-page">
      <a class="btn project-back-link" href="/#projects">← Back to projects</a>
      <p class="project-page-status" role="status">Loading project...</p>
      <article class="project-page-content" hidden>
        <header class="project-detail-intro">
          <div class="project-detail-eyebrow">
            <span class="project-detail-number"></span>
            <span class="project-detail-category"></span>
            <span class="project-detail-live" hidden>Live project</span>
          </div>
          <h1 class="project-detail-header"></h1>
          <p class="project-detail-description"></p>
          <div class="project-actions project-detail-actions"></div>
        </header>
        <figure class="project-detail-preview" hidden>
          <img class="project-detail-image" />
        </figure>
        <div class="project-detail-body">
          <section class="project-readme-section">
            <h2>// Project overview</h2>
            <div class="project-readme"></div>
          </section>
          <aside class="project-detail-sidebar">
            <div class="project-detail-stack-panel">
              <h2>// Stack</h2>
              <ul class="project-detail-stack"></ul>
            </div>
          </aside>
        </div>
      </article>
    </main>
  </body>
</html>
